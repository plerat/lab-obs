# Loki monolithique (SingleBinary) + stockage filesystem.
# Chart : grafana-community/loki (le chart grafana/loki est désormais réservé à GEL).
# Ingestion native OTLP sur /otlp (pas de Promtail).
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true     # requis pour OTLP (trace_id, span_id, attributs)
    volume_enabled: true
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# On coupe tous les composants des autres modes de déploiement
read:            { replicas: 0 }
write:           { replicas: 0 }
backend:         { replicas: 0 }
ingester:        { replicas: 0 }
querier:         { replicas: 0 }
queryFrontend:   { replicas: 0 }
queryScheduler:  { replicas: 0 }
distributor:     { replicas: 0 }
compactor:       { replicas: 0 }
indexGateway:    { replicas: 0 }
bloomCompactor:  { replicas: 0 }
bloomGateway:    { replicas: 0 }

# Pas de gateway nginx : le Collector et Grafana parlent directement au service "loki" (3100)
gateway:
  enabled: false

chunksCache:
  enabled: false
resultsCache:
  enabled: false
minio:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
